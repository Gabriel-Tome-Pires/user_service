replicaCount: 2
image:
  repository: user_service-user_service
  pullPolicy: Never
  tag: "latest"

database:
  host: user-db
  port: 5432
  name: user
  secretName: db-credentials-secret
  usernameKey: POSTGRES_USER
  passwordKey: POSTGRES_PASSWORD

imagePullSecrets: []
nameOverride: "user-service"
fullnameOverride: "user-service"

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}
service:
  type: ClusterIP

  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}

  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
  - name: gateway
    sectionName: http
  hostnames:
  - chart-example.local
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /headers

resources: {}

#livenessProbe:
#  httpGet:
#    path: /actuator/health
#    port: 8080
#  initialDelaySeconds: 30
#  periodSeconds: 10
#  timeoutSeconds: 5
#  failureThreshold: 5

#readinessProbe:
#  httpGet:
#    path: /actuator/health
#    port: 8080
#  initialDelaySeconds: 20
#  periodSeconds: 10
#  timeoutSeconds: 5
#  failureThreshold: 5


autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []

volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}